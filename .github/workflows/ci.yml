name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux: gcc + clang, Debug and Release. Full ctest suite.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install codespell
        run: pip install codespell

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=${{ matrix.build_type }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --test-timeout 120

  # ---------------------------------------------------------------------------
  # macOS: AppleClang, Debug and Release.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS / ${{ matrix.build_type }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Install codespell
        run: pip install codespell

      - name: Expose clang-tidy (macOS)
        run: |
          brew list llvm &>/dev/null || brew install llvm
          echo "$(brew --install-prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=${{ matrix.build_type }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --test-timeout 120

  # ---------------------------------------------------------------------------
  # Windows: MSVC, Debug and Release. Shared Serialization.dll sits next to
  # the test exe via RUNTIME_OUTPUT_DIRECTORY.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows / ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install codespell
        run: pip install codespell

      - name: Configure
        run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type ${{ matrix.build_type }} --parallel=4

      - name: Test
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type ${{ matrix.build_type }} --test-timeout 120

  # ---------------------------------------------------------------------------
  # Sanitizers: Clang ASan and UBSan, Debug. Linux + macOS only.
  # ---------------------------------------------------------------------------
  sanitize:
    name: Sanitizer / ${{ matrix.os }} / ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install codespell
        run: pip install codespell

      - name: Expose clang-tidy (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list llvm &>/dev/null || brew install llvm
          echo "$(brew --install-prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --sanitizer=ON
          --sanitizer-types=${{ matrix.sanitizer }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel=4

      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --test-timeout 180

  # ---------------------------------------------------------------------------
  # Compiler cache + Icecream: exercises SERIALIZATION_ENABLE_CACHE /
  # SERIALIZATION_CACHE_TYPE (ccache, sccache, buildcache) and
  # SERIALIZATION_ENABLE_ICECC across Linux, macOS, and Windows. Icecream has
  # no Windows port, so there is no windows-icecc entry.
  # ---------------------------------------------------------------------------
  cache-icecc:
    name: Cache/Icecc / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            backend: ccache
            icecc: 'OFF'
          - name: linux-sccache
            os: ubuntu-latest
            backend: sccache
            icecc: 'OFF'
          - name: linux-icecc
            os: ubuntu-latest
            backend: none
            icecc: 'ON'
          - name: macos-ccache
            os: macos-latest
            backend: ccache
            icecc: 'OFF'
          - name: macos-sccache
            os: macos-latest
            backend: sccache
            icecc: 'OFF'
          - name: macos-icecc
            os: macos-latest
            backend: none
            icecc: 'ON'
          - name: windows-ccache
            os: windows-latest
            backend: ccache
            icecc: 'OFF'
          - name: windows-sccache
            os: windows-latest
            backend: sccache
            icecc: 'OFF'
          - name: linux-buildcache
            os: ubuntu-latest
            backend: buildcache
            icecc: 'OFF'
          - name: macos-buildcache
            os: macos-latest
            backend: buildcache
            icecc: 'OFF'
          - name: windows-buildcache
            os: windows-latest
            backend: buildcache
            icecc: 'OFF'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja, ccache, icecc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache icecc

      - name: Install Ninja, ccache, icecream (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache icecream

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ccache

      - name: Set up sccache
        if: matrix.backend == 'sccache'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set BuildCache directory
        if: matrix.backend == 'buildcache'
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Install BuildCache
        if: matrix.backend == 'buildcache'
        shell: bash
        run: python3 .github/scripts/install_buildcache.py --install-prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cache=ON
          --cache-backend=${{ matrix.backend }}
          --icecc=${{ matrix.icecc }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --cache=ON
          --cache-backend=${{ matrix.backend }}
          --icecc=${{ matrix.icecc }}

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel=4

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release --parallel=4

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --test-timeout 120

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release --test-timeout 120
